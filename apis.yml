aid: expensify
name: Expensify
description: >-
  Expensify is an expense management platform that automates receipt scanning,
  expense reporting, reimbursement, corporate card reconciliation, bill pay,
  invoicing, and travel booking for individuals, small businesses, and
  enterprises. The Expensify Integration Server API enables programmatic export
  of expense data, creation and update of policies and employees, and
  bidirectional data flow with accounting and HR systems. Authentication uses
  partnerUserID and partnerUserSecret credentials passed in a
  requestJobDescription JSON payload on every request.
type: Index
